server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/chatdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  redis:
    host: localhost
    port: 6379
    password: 123456
    timeout: 3000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.chat.model
  configuration:
    map-underscore-to-camel-case: true

chat:
  thumb-dir: ./thumbnails
  thumb-max-mb: 500
  thumb-queue-size: 200
  # ffmpeg路径配置
  # Windows: ./tools/ffmpeg.exe
  # Linux:   /usr/bin/ffmpeg 或 /usr/local/bin/ffmpeg
  ffmpeg-path: ./tools/ffmpeg.exe


